global:
  scrape_interval: 15s

scrape_configs:
  # Services run on the host during local development; add a target per service port.
  - job_name: driversim-services
    metrics_path: /metrics
    static_configs:
      - targets:
          - host.docker.internal:4000
          - host.docker.internal:4001
          - host.docker.internal:4002
