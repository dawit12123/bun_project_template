name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Finds which workspaces changed so each service is checked independently.
  changes:
    runs-on: ubuntu-latest
    outputs:
      packages: ${{ steps.detect.outputs.packages }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: detect
        run: |
          base="${{ github.event.pull_request.base.sha || github.event.before }}"
          all=$(ls -d bootstrap/package.json packages/*/package.json packages/infra/*/package.json database/package.json templates/*/package.json services/*/package.json 2>/dev/null | xargs -n1 dirname | jq -R . | jq -cs .)
          if [ -z "$base" ] || ! git cat-file -e "$base" 2>/dev/null || git diff --name-only "$base" HEAD | grep -qvE '^(templates|services)/'; then
            echo "packages=$all" >> "$GITHUB_OUTPUT"
          else
            changed=$(git diff --name-only "$base" HEAD | cut -d/ -f1-2 | sort -u | jq -R . | jq -cs .)
            echo "packages=$changed" >> "$GITHUB_OUTPUT"
          fi

  check:
    needs: changes
    if: needs.changes.outputs.packages != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.changes.outputs.packages) }}
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 3s --health-retries 20
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    env:
      TEST_DATABASE_URL: postgres://ci:ci@localhost:5432/ci_test
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.23
      - run: bun install --frozen-lockfile
        working-directory: .
      - run: bun run typecheck
      - run: bunx biome ci .
      - name: test
        run: if grep -q '"test"' package.json; then bun test; else echo "no tests"; fi
